          #           (= 0.625rem - 1px = 9px) + 上下各 1px 边框 + 20px 行高 撑到 40px 的,
          #           正好等于搜索框的 tw-min-h-10(40px) —— 本来就对齐。
          #     修法: 只覆盖 padding-left / padding-right, 纵向留给 bitButton 自己
          #           (这样上游调尺寸时按钮能跟着走, 不会再次错位)。
          #
          #     🔴 判据必须**限定在那条规则块内** —— `padding: 0 12px !important` 在本文件里还有
          #        另一处无关的出现(.warden-head-newbar #newItemButton), 那处同时写了显式
          #        height: 28px, 清零纵向 padding 是无害的。写成全局
          #        `grep -qF 'padding: 0 12px !important'` 会把它一起算进来 ⇒ **误报**。
          #        所以用 `grep -A4 <选择器行> | grep` 把范围收进规则块。
          if grep -A4 -F -- '> .warden-filter-toggle button {' .vw.css | grep -qF -- 'padding: 0 12px'; then
            echo "❌ O1 的筛选按钮又用回了 padding 简写: 纵向内边距被清零, 按钮会塌到 22px(与搜索框差 18px)" >&2
            fail=1
          fi
          grep -A4 -F -- '> .warden-filter-toggle button {' .vw.css \
            | grep -qF -- 'padding-left: 12px !important' \
            || { echo "❌ .vw.css 里 O1 的筛选按钮没有只覆盖横向内边距(P 段的修法没落进去)" >&2; fail=1; }

          # 21) 第十三批 / Q 段: 窄屏设置页的间距/换行 + 下拉面板跟随输入框(用户反馈 6 条)
          #     ← libs/components/src/select/select.component.ts        (问题1/3: 下拉面板被甩飞)
          #       + auth/settings/account/profile.component.ts          (问题2: 名称保存后卡片不变)
          #       + layouts/account-card.component.ts                   (问题4: 卡片只在「我的账户」页)
          #       + settings/domain-rules.component.html                (问题5: 自定义域名表单默认一行)
          #       + auth/settings/emergency-access/emergency-access.component.html (问题6: 标题/按钮拆两行)
          #       + css/vaultwarden.css (Q 段: Q1 指纹→名称留白 / Q2 邮箱→危险区留白 / Q3 紧急访问拆行)
          #     与第十一批同理: **不是 L4 迁入的**, 是上线后按用户反馈新增的, 段标记为「Q 段」。
          #
          #     .main.js  'warden-ea-head' —— 紧急访问标题行的标记类(模板静态 class)。
          #               ★ 为什么必须加标记类: 那个组件没声明 selector, 渲染成 <ng-component>,
          #                 所以 CSS 里没法用 `app-emergency-access` 选中它(详见模板里的注释)。
          #     .main.js  'attributeFilter:["style"]' —— 下拉面板几何盯梢(MutationObserver)。
          #               ★ 这一条是本批**唯一只存在于 TS 里**的修复: 不体现在 CSS/模板上,
          #                 rebase 上游时最容易整段丢掉, 而丢了只在真机上表现为"点箭头没反应"。
          #                 `attributeFilter` 是 DOM API 契约的属性名, 不参与 terser 的标识符混淆,
          #                 所以按字面量断言是稳的(v2026.8.2 线上产物实测 0 次 ⇒ 有区分度)。
          #     .vw.css   'Q. 第十三批'  —— 段横幅
          #     .vw.css   '.warden-ea-head' / 'app-profile .tw-grid' /
          #               'app-danger-zone > h1.tw-mt-16' —— Q1/Q2/Q3 的三条选择器
          #     ⚠️ 不要断言 'setAccountName' 来代表问题2: 官方基线本来就有 1 次, 等于"没修也能过"。
          #     🔴 同样要 `--`: 'attributeFilter:["style"]' 以 `a` 开头没事, 但 Q 段的选择器里有
          #        `.` 开头的, 统一带上 `--` 省得下次加 `--warden-*` 时又栽(fail-fast 的教训)。
          for lit in 'warden-ea-head' 'attributeFilter:["style"]'; do
            grep -qF -- "${lit}" .main.js \
              || { echo "❌ 产物 main.js 里找不到第十三批的标记 '${lit}'" >&2; fail=1; }
          done
          for lit in 'Q. 第十三批' '.warden-ea-head' 'app-profile .tw-grid' \
                     'app-danger-zone > h1.tw-mt-16'; do
            grep -qF -- "${lit}" .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到第十三批的标记 '${lit}'" >&2; fail=1; }
          done
          #    ★ 负向守卫: 把「标题 + 按钮」拆两行的规则**必须**写在 @media (max-width:768px) 里
          #      (在本文件里表现为规则行有缩进), 顶格 = 桌面端标题与按钮也会被拆成上下两行。
          if grep -qE '^main#main-content \.warden-ea-head' .vw.css; then
            echo "❌ Q3 的紧急访问拆行规则写成了全局: 桌面端标题与按钮也会被拆成上下两行" >&2
            fail=1
          fi

          [ "${fail}" -eq 0 ] || exit 1
          echo "✅ 二十一项源码级定制(F/G/J8/J9/J12/J14/J17 + 视口 + 主密码长度 + J7/A段 + 第六批 4b/I/J10/J11 + 第七批 J6/B段 + 第八批 J16/E段 + 第九批 J15 + 第十批/N段 + 第十一批/O段 + 第十二批/P段 + 第十三批/Q段)均已在实际产物中得到验证"

      - name: Disk space after
        if: always()
        run: df -h / /home/runner

      # 产物只以 Actions artifact 形式保存(不建 Release)。
      # 为什么不发 Release: 本仓库(一个 fork)的 Releases API 在 GitHub 侧是坏的 ——
      # POST /releases 与 PATCH /repos 一律返回 **HTTP 500 且 body 为空**,
      # 用 workflow 的 GITHUB_TOKEN 和全权限 PAT 都一样(DELETE tag 却正常返回 204)。
      # 实测 POST /releases 虽然报 500, 却会真的建出 release 记录 → 留下重复的脏数据。
      # 所以改走 artifact: 部署工作流用 `gh run download` 取(同仓库, 默认 token 就能读)。
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bw_web_vault-${{ inputs.version }}
          path: bw_web_vault.tar.gz
          # 部署侧要靠它, 别按默认 14 天过期; 过期了部署会直接失败(不会静默降级)
          retention-days: 90
