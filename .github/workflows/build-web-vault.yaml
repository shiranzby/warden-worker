          #       · TOTP 算法: L4 自写 Base32/HOTP/TOTP(RFC 4648/4226/6238, ~150 行)
          #         → 官方 TotpService(底层 Rust SDK 的 generate_totp), 一行自写加密都没有
          #       · 取密钥: L4 运行期拿 KeyService+EncryptService 解密 login.totp, 且**跳过组织条目**
