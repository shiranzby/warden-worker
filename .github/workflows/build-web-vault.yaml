name: Build Web Vault (patched)

# 从源码构建"我们自己的"前端产物。与部署解耦 —— 只在改了前端源码时才需要重跑一次。
# 设计/迁移方案: docs/webvault-source-migration.md
#
# 前端源码来源: shiranzby/vw_web_builds 的 shypwd 分支
#   = vaultwarden/vw_web_builds 的某个版本分支 + 我们的定制提交
# 也就是说定制(移动端视口 / 最小主密码长度 / vaultwarden.css)已经在源码里,
# 构建后**不再**需要任何 sed/python 事后注入, 也不再需要打补丁。
# 构建配方对齐 dani-garcia/bw_web_builds 的 Dockerfile(node:24 + npm ci + dist:oss:selfhost)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物标签 / artifact 名 (如 v2026.8.9)。会与源码里的版本核对, 不一致直接失败"
        required: true
        default: "v2026.8.9"

env:
  # 我们的前端源码 fork。定制已直接落在源码里(见 fork 的 shypwd 分支)。
  VAULT_REPO: "https://github.com/shiranzby/vw_web_builds.git"
  VAULT_BRANCH: "shypwd"
  VAULT_FOLDER: "bw_clients"

jobs:
  build:
    name: Build web vault from source
    runs-on: ubuntu-latest
    # 首次约 20-35 分钟(装整个 monorepo + Angular 生产构建), 给足余量
    timeout-minutes: 90

    steps:
      # 目前这一步只为"将来可能需要仓库内的构建脚本/校验文件"而保留;
      # 定制搬进 fork 源码后, 构建本身已不再依赖本仓库的任何文件。
      - name: Checkout our repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Disk space before
        run: df -h / /home/runner

      - name: Compute version variables
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          echo "VERSION_NO_V=${V#v}" >> "$GITHUB_ENV"   # v2026.8.0 -> 2026.8.0 (vw-version.json 用)
          echo "版本变量: VERSION_NO_V=${V#v}"

      - name: Clone our frontend fork
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${VAULT_BRANCH}" "${VAULT_REPO}" "${VAULT_FOLDER}"
          echo "repo   : ${VAULT_REPO}"
          echo "branch : ${VAULT_BRANCH}"
          echo "commit : $(git -C "${VAULT_FOLDER}" rev-parse HEAD)"

      # 版本一致性校验。inputs.version 决定 artifact 名, 而部署侧是按 artifact 名反查构建的,
      # 一旦标错版本, 部署侧就找不到产物(或更糟: 静默用了错版本的产物)。这里用源码里的
      # apps/web/package.json 兜底 —— 它才是产物真实的 Bitwarden 版本。
      - name: Verify version matches the source
        run: |
          set -euo pipefail
          SRC_VER="$(node -p "require('./${VAULT_FOLDER}/apps/web/package.json').version")"
          echo "源码版本 = ${SRC_VER}"
          echo "输入版本 = ${VERSION_NO_V}"
          if [ "${SRC_VER}" != "${VERSION_NO_V}" ]; then
            echo "❌ 版本不一致: 源码是 ${SRC_VER}, 但 inputs.version 是 v${VERSION_NO_V}。" >&2
            echo "   要么把 inputs.version 改成 v${SRC_VER}, 要么先把 fork 的 ${VAULT_BRANCH} 分支 rebase 到目标版本。" >&2
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}"
          npm ci --no-audit --no-fund

      - name: Build web vault (oss, selfhost)
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}/apps/web"
          npm run dist:oss:selfhost

          # vw-version.json —— 官方 bw_web_builds 的 build_web_vault.sh 也会生成它。
          # 注意它记的不是 Bitwarden 版本, 而是"构建仓库自己的 tag": 官方 v2026.6.4 的产物里
          # 内容是 {"version":"2026.6.4"}。上游用 `git ls-remote` 取"远端最新 tag", 我们版本是钉死的,
          # 所以等价于"我们钉的 tag 去掉前导 v"。必须生成 —— 否则产物比官方少一个文件。
          printf '{"version":"%s"}' "${VERSION_NO_V}" > build/vw-version.json
          echo "vw-version.json: $(cat build/vw-version.json)"

          echo "── 产物 ──"
          ls -la build > .build-listing.txt || true
          head -20 .build-listing.txt

      - name: "Package (structure must match bw_web_builds: web-vault/ at top level)"
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}/apps/web"
          mv build web-vault
          tar -czvf "${GITHUB_WORKSPACE}/bw_web_vault.tar.gz" web-vault --owner=0 --group=0

          cd "${GITHUB_WORKSPACE}"
          echo "=== sha256 ==="
          sha256sum bw_web_vault.tar.gz
          echo "=== 大小 ==="
          du -h bw_web_vault.tar.gz

          # ⚠️ 先把清单落盘再截取。直接写 `tar -tzf ... | head -N` 会在 set -o pipefail 下失败:
          # head 读够 N 行就退出 → tar 继续写管道拿到 EPIPE → "tar: stdout: write error" → exit 2
          # → 整步失败。任何"消费者可能提前退出"的管道都不要和 pipefail 一起用。
          tar -tzf bw_web_vault.tar.gz > .vault-contents.txt
          echo "=== 顶层结构(应与官方一致: web-vault/) ==="
          head -12 .vault-contents.txt
          echo "=== 文件数 ==="
          wc -l < .vault-contents.txt
          echo "=== 自带 source map 数(本地读源码靠它) ==="
          grep -c '\.map$' .vault-contents.txt || true
          echo "=== vw-version.json(应为 {\"version\":\"${VERSION_NO_V}\"}) ==="
          tar -xzOf bw_web_vault.tar.gz web-vault/vw-version.json || echo "❌ 缺少 vw-version.json"
          # 同样落盘再打印, 避免 pipefail + SIGPIPE
          tar -xzOf bw_web_vault.tar.gz web-vault/css/vaultwarden.css > .vw.css 2>/dev/null \
            && { echo "=== css/vaultwarden.css(应由构建自带, 过去靠部署时 cp 补) ==="; head -8 .vw.css; } \
            || echo "❌ 缺少 css/vaultwarden.css"

      # 断言"定制真的进了产物"。以前这里断言的是"补丁打上去了"; 现在定制在源码里,
      # 所以改为断言源码级定制在**产物**中可见 —— 防止 rebase 上游时把改动弄丢。
      - name: Verify our customizations are in the built artifact
        run: |
          set -euo pipefail

          tar -xzOf bw_web_vault.tar.gz web-vault/index.html > .index.html
          VIEWPORT="$(grep -o '<meta name="viewport"[^>]*>' .index.html || true)"
          echo "viewport: ${VIEWPORT}"

          # 用落盘的清单再 grep —— 不能写 `tar -tzf ... | grep -m1`, 见上一步注释(pipefail + SIGPIPE)
          MAIN_JS="$(grep -m1 'app/main\..*\.js$' .vault-contents.txt || true)"
          if [ -z "${MAIN_JS}" ]; then echo "❌ 清单里找不到 app/main.*.js" >&2; exit 1; fi
          tar -xzOf bw_web_vault.tar.gz "${MAIN_JS}" > .main.js
          echo "主密码最小长度常量:"
          grep -o 'minimumPasswordLength=[0-9]*' .main.js | sort -u || true
          echo "同名的原始常量(必须仍是 8, 官方用它判断策略是否变更过):"
          grep -o 'originalMinimumPasswordLength=[0-9]*' .main.js | sort -u || true

          fail=0

          # 1) 移动端视口  ← apps/web/src/index.html
          case "${VIEWPORT}" in
            *width=1010*)
              echo "❌ viewport 仍是 width=1010 —— 源码里的定制丢了" >&2; fail=1 ;;
            *width=device-width*)
              echo "✅ viewport 自适应 (device-width)" ;;
            *)
              echo "❌ viewport 既不是 1010 也不是 device-width, 意外值: ${VIEWPORT}" >&2; fail=1 ;;
          esac

          # 2) 最小主密码长度  ← libs/common/src/platform/misc/utils.ts
          #    注意源码里另有一个 originalMinimumPasswordLength(大写 M)=8, 这里查的是小写 m 的
          #    minimumPasswordLength, 不会被它误判成"已改过"。
          if grep -q 'minimumPasswordLength=12' .main.js; then
            echo "❌ 主密码最小长度仍是 12 —— 源码里的定制丢了" >&2; fail=1
          fi
          grep -q 'minimumPasswordLength=8' .main.js \
            || { echo "❌ 产物里没有 minimumPasswordLength=8" >&2; fail=1; }

          # 3) vaultwarden.css  ← apps/web/src/css/ + copy-webpack-plugin 的 patterns
          #    上游只在 index.html 里加了 <link href="css/vaultwarden.css">, 但 copy-webpack-plugin
          #    默认不复制 src/css, 所以官方产物从来没有这个文件。我们的 fork 显式声明了复制规则。
          if tar -xzOf bw_web_vault.tar.gz web-vault/css/vaultwarden.css > .vw.css 2>/dev/null; then
            grep -q '\.vw-hide' .vw.css \
              || { echo "❌ css/vaultwarden.css 内容不对(找不到 .vw-hide)" >&2; fail=1; }
            # 移动端适配段(H 留白压缩 / K 对话框压缩 / M 下拉加固)也必须在里面 ——
            # 它们是 2026-09-13 从 L4(custom/custom.css) 迁进 fork 源码的。
            grep -q 'shypwd mobile adaptation' .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到移动端适配段(H/K/M)" >&2; fail=1; }
            # F 段(窄屏布局: 保险库页改上下堆叠)同样来自 L4 的迁移, 2026-09-13 落地。
            # 断言的是**段标记注释**(CSS 不参与 minify, 注释会原样保留), 比断言某条 CSS
            # 值更稳: 值可能被后续调整, 段标记只在整段被删/被 rebase 冲掉时才消失。
            grep -q 'F\. 窄屏布局' .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到 F 段(窄屏布局)" >&2; fail=1; }
            # G 段(底部标签栏样式)也是 L4 迁移来的, 随 J17 落地(2026-09-13)。同上看段标记。
            grep -q 'G\. 底部标签栏' .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到 G 段(底部标签栏)" >&2; fail=1; }
            echo "✅ css/vaultwarden.css 由构建自带 ($(wc -c < .vw.css) bytes)"
          else
            echo "❌ 产物缺少 css/vaultwarden.css —— copy-webpack-plugin 的复制规则没生效" >&2; fail=1
          fi

          # 4) J8 网格下限  ← libs/components/src/layout/layout.component.ts
          #    MAIN_MIN_WIDTH_REM(24rem) 与 <main> 的 tw-min-w-96 是配套的, 窄屏会溢出。
          #    源码把它包进 resolveMainMinWidthPx() 并 cap 到容器宽度。
          #
          #    ⚠️ 这里**不能** grep 函数名 —— 生产构建的 terser 会把
          #    resolveMainMinWidthPx 改名(实测改成了 D), 名字在产物里根本不存在,
          #    照名字断言会得到"改动丢了"的假警报。改为断言**编译后的结构**:
          #        function D(e){const t=24*(0,v.T)();return Math.min(t,e>0?e:t)}
          #    即 "24 * 一个零参导入函数" 紧跟 "return Math.min(" —— 这个形状直译
          #    自源码的 `Math.min(floor, containerWidth>0?containerWidth:floor)`,
          #    与标识符命名无关, 只随 J8 本身的存在而存在。
          #    (若将来这块被上游重写导致误报, 先看 layout.component.ts 的
          #     resolveMainMinWidthPx 是否还在, 再决定改断言还是改实现。)
          grep -qE '24\*\(0,[A-Za-z0-9_$]+\.[A-Za-z0-9_$]+\)\(\);return Math\.min\(' .main.js \
            || { echo "❌ 产物里找不到 J8(网格最小宽度 cap) 的编译特征" >&2; fail=1; }

          # 5) J12 行内菜单「文件夹」 ← vault-cipher-row.component.html / .ts
          #    需求是「添加到文件夹」→「文件夹」。源码里靠抛 moveToFolder 事件复用
          #    官方 bulkMove 链路(11 行替代 L4 的 467 行)。
          #
          #    ⚠️ 不能只 grep 'moveToFolder' 四个字 —— **上游本来就有 2 处**:
          #         bulkMoveToFolder(){this.event({type:"moveToFolder",…})}   (表头批量菜单)
          #         case"moveToFolder": yield this.bulkMove(…)               (vault.component 分发)
          #    按名字断言会在没迁的情况下也通过(实测官方基线就是 2 次)。
          #    要断言的是**行组件独有的那条 emit**(官方没有):
          #         moveToFolder(){ this.onEvent.emit({type:"moveToFolder", items:[this.cipher]}) }
          #    属性名(onEvent/emit/type/items/cipher)不参与标识符混淆, 字符串字面量也不
          #    参与, 所以这段可以用 -F 原样查。(实测: 官方基线 2 次命中此串; 我们是 5 次。)
          grep -qF 'onEvent.emit({type:"moveToFolder"' .main.js \
            || { echo "❌ 产物里找不到 J12(行组件 emit moveToFolder)" >&2; fail=1; }
          echo "moveToFolder 总出现次数: $(grep -o 'moveToFolder' .main.js | wc -l)  (官方基线为 2)"

          # 6) J17 底部标签栏  ← apps/web/src/app/layouts/mobile-tab-bar.component.{ts,html}
          #                    + web-layout.component.{ts,html}(挂载点)
          #    L4 的 §10 是"每次路由变化后往 document.body 注入 <nav>"。源码层改成一个
          #    **常驻组件**(app-mobile-tab-bar), 挂在 app-layout 外壳里 ——
          #    这个外壳只有登录后的 user/organization-layout 用, 等价于 L4 的 bit-layout 守卫。
          #    它是 keystone: F2 想隐藏 side-nav、I 段想隐藏 app-vault-header, 都靠它提供入口。
          #
          #    断言两个字符串字面量(不参与标识符混淆), 实测官方基线**都不含**:
          #      warden-tabbar      —— 组件模板的宿主 id/class(模板没被编译进来就没有)
          #      app-mobile-tab-bar —— 组件选择器
          #    (CSS 那一半的 G 段标记已在上面第 3 项里断言。)
          grep -qF 'warden-tabbar' .main.js \
            || { echo "❌ 产物里找不到 J17(底栏宿主 id/class 'warden-tabbar')" >&2; fail=1; }
          grep -qF 'app-mobile-tab-bar' .main.js \
            || { echo "❌ 产物里找不到 J17(组件选择器 'app-mobile-tab-bar')" >&2; fail=1; }
          echo "warden-tabbar 总出现次数: $(grep -o 'warden-tabbar' .main.js | wc -l)  (官方基线为 0)"

          # 7) J9 窄屏筛选抽屉  ← vault-filter.component.{ts,html} + css/vaultwarden.css(J9 段)
          #    L4 §7.1 是往 app-vault-filter 注入 #warden-filterbar、切 body 的 class。
          #    源码层改成: 官方 vault-filter 组件自己持有 filterSectionsExpanded,
          #    模板给 filters-body 绑 [class.warden-filter-collapsed], 开关是模板内元素。
          #
          #    断言两个**类名字面量**(不参与标识符混淆), 实测官方基线**都不含**:
          #      warden-filter-toggle     —— 开关的静态 class
          #      warden-filter-collapsed  —— 收起态的类绑定名(编译成 ɵɵclassProp("…"))
          #    ⚠️ 不要断言 app-vault-filter / aria-expanded: 官方本来就都有,
          #       按它们断言等于"没迁也能过"(实测两边都 HIT, 已弃用)。
          #    CSS 那一半的段标记在下面第 8 项。
          grep -qF 'warden-filter-toggle' .main.js \
            || { echo "❌ 产物里找不到 J9(开关 class 'warden-filter-toggle')" >&2; fail=1; }
          grep -qF 'warden-filter-collapsed' .main.js \
            || { echo "❌ 产物里找不到 J9(收起态类绑定 'warden-filter-collapsed')" >&2; fail=1; }
          echo "warden-filter-toggle 总出现次数: $(grep -o 'warden-filter-toggle' .main.js | wc -l)  (官方基线为 0)"

          # 8) J9 的样式段  ← apps/web/src/css/vaultwarden.css
          #    同 F/G 段: CSS 不参与 minify, 用**中文段标记**断言最稳(值可能被后续调整,
          #    段标记只在整段被删/rebase 冲掉时才消失)。
          #    收起规则必须写在 @media (max-width:768px) 里 —— 放外面会让桌面端也收起。
          grep -q '窄屏筛选抽屉' .vw.css \
            || { echo "❌ css/vaultwarden.css 里找不到 J9 段(窄屏筛选抽屉)" >&2; fail=1; }
          grep -q '\.warden-filter-collapsed' .vw.css \
            || { echo "❌ J9 段里找不到收起规则(.warden-filter-collapsed)" >&2; fail=1; }

          # 9) J7 / J14 / A 段  ← vault-items.component.{ts,html} + css/vaultwarden.css
          #    窄屏「选择」胶囊 + 复选框列塌缩/放出。L4 是运行期做的(custom.js 往「名称」th
          #    里 appendChild 一个 #warden-headbar, 再切 body 上的 .warden-selecting);
          #    源码层改成模板内的 .warden-headbar + <bit-table> 上的 [class.*] 绑定,
          #    状态由组件自己的 signal 持有(toggleSelecting → selection.clear())。
          #
          #    断言 6 个**类名字面量**(静态 class / [class.x] 绑定的键名, 都不参与标识符
          #    混淆), 实测官方基线**都不含** —— 探针 .deploycheck/probe-j7-assert.mjs 逐条核过。
          #    ⚠️ 不要断言 i18n 的 select/cancel: 官方本来就有, 等于"没迁也能过"。
          for lit in warden-headbar warden-select-toggle warden-select-on \
                     warden-name-th warden-selectable warden-selecting; do
            grep -qF "${lit}" .main.js \
              || { echo "❌ 产物里找不到 J7/J14 的标记 '${lit}'" >&2; fail=1; }
          done
          echo "warden-select-toggle 总出现次数: $(grep -o 'warden-select-toggle' .main.js | wc -l)  (官方基线为 0)"

          # 10) J7/J14/A 段的样式  ← apps/web/src/css/vaultwarden.css
          grep -q 'J7 / J14 / A' .vw.css \
            || { echo "❌ css/vaultwarden.css 里找不到 J7/J14/A 段标记" >&2; fail=1; }
          grep -q '\.warden-headbar' .vw.css \
            || { echo "❌ J7 段里找不到 .warden-headbar" >&2; fail=1; }
          grep -q '\.warden-select-toggle' .vw.css \
            || { echo "❌ J7 段里找不到 .warden-select-toggle" >&2; fail=1; }
          grep -q '\.warden-selectable' .vw.css \
            || { echo "❌ J7 段里找不到 .warden-selectable" >&2; fail=1; }
          #    ★ 决策 B 的负向守卫: A 段的塌缩**必须**写在 @media (max-width:768px) 里
          #      (在这个文件里表现为规则行有两格缩进), 不能是顶格的全局规则。
          #      顶格 = 桌面端复选框列也被塌成 0 宽, 而按决策 B 桌面端不显示「选择」胶囊,
          #      于是桌面端会彻底失去批量选择入口 —— 这正是一开始要修的那个泄漏。
          if grep -qE '^\.warden-selectable' .vw.css; then
            echo "❌ A 段塌缩成了全局规则: 桌面端复选框列会被塌成 0, 而桌面端没有胶囊可用" >&2
            fail=1
          fi

          # 11) 第六批: 4b + I 段 + J10(账户卡片) + J11(二级导航 chips)
          #     ← layouts/mobile-sub-nav.component.{ts,html} + layouts/account-card.component.{ts,html}
          #     这一批把 L4 的三套运行期机制搬成了**源码组件**:
          #       J11: custom.js §7.3 注入 <nav id=warden-subnav> + location.hash 跳转 + 手工高亮
          #       J10: custom.js §7.2 注入 #warden-acctcard(头像上传靠劫持 window.fetch 偷 token)
          #     断言 10 个类名/字符串字面量, 实测官方基线**都不含**
          #     (探针 .deploycheck/probe-batch6-assert.mjs: 21/21 有区分度)。
