          #         字面量不同步的后果: 这一条 grep 直接不命中 ⇒ CI 报"第十五批的标记丢了"。
          S_CSS_LITS=('S 段. 移动端适配(第十五批)' \
                      'main#main-content h1.warden-auth-title' \
                      'main#main-content app-header.warden-bare-header bit-header' \
                      'main#main-content .warden-domain-row bit-form-field textarea[bitInput]' \
                      '.warden-totp-next' '.warden-totp-ghost' \
                      '.warden-totp-rolling .warden-totp-digits' \
                      '@keyframes warden-totp-promote' \
                      '@keyframes warden-totp-retire')
          for lit in "${S_CSS_LITS[@]}"; do
