          #           (= 0.625rem - 1px = 9px) + 上下各 1px 边框 + 20px 行高 撑到 40px 的,
          #           正好等于搜索框的 tw-min-h-10(40px) —— 本来就对齐。
          #     修法: 只覆盖 padding-left / padding-right, 纵向留给 bitButton 自己
          #           (这样上游调尺寸时按钮能跟着走, 不会再次错位)。
          #
          #     🔴 判据必须**限定在那条规则块内** —— `padding: 0 12px !important` 在本文件里还有
          #        另一处无关的出现(.warden-head-newbar #newItemButton), 那处同时写了显式
          #        height: 28px, 清零纵向 padding 是无害的。写成全局
          #        `grep -qF 'padding: 0 12px !important'` 会把它一起算进来 ⇒ **误报**。
          #        所以用 `grep -A4 <选择器行> | grep` 把范围收进规则块。
          if grep -A4 -F -- '> .warden-filter-toggle button {' .vw.css | grep -qF -- 'padding: 0 12px'; then
            echo "❌ O1 的筛选按钮又用回了 padding 简写: 纵向内边距被清零, 按钮会塌到 22px(与搜索框差 18px)" >&2
            fail=1
          fi
          grep -A4 -F -- '> .warden-filter-toggle button {' .vw.css \
            | grep -qF -- 'padding-left: 12px !important' \
            || { echo "❌ .vw.css 里 O1 的筛选按钮没有只覆盖横向内边距(P 段的修法没落进去)" >&2; fail=1; }

          # 21) 第十三批 / Q 段: 窄屏设置页的间距/换行 + 下拉面板跟随输入框(用户反馈 6 条)
          #     ← libs/components/src/select/select.component.ts        (问题1/3: 下拉面板被甩飞)
          #       + auth/settings/account/profile.component.ts          (问题2: 名称保存后卡片不变)
          #       + layouts/account-card.component.ts                   (问题4: 卡片只在「我的账户」页)
          #       + settings/domain-rules.component.html                (问题5: 自定义域名表单默认一行)
          #       + auth/settings/emergency-access/emergency-access.component.html (问题6: 标题/按钮拆两行)
