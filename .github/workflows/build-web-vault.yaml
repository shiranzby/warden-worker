          #     段标记「T 段」。
          #
          #     .main.js  'warden-domain-row' —— T2 的**页级钩子类**(domain-rules.component.html
          #               行 div 上的静态 class)。
          #               ★ 必须与 .vw.css 里的同名选择器**成对**断言: 只断 CSS 的话, 有人把
          #                 模板上的钩子删了, 样式就变成"谁都不命中", 功能静默失效而 CI 全绿。
          #     .main.js  'Math.floor(Date.now()/1e3)' —— T3 的**唯一静态判据**。
          #               原实现是 `Math.round(Date.now()/1000)`, 它会在 TOTP 窗口边界**前最多
          #               0.5s** 就越过边界 ⇒ 升格动画拿着**旧码**先跑, 等新码送到才闪一下换掉
          #               (用户报"上移过程中会先变成原主码, 然后闪一下才变成新码")。
          #               改成与 TOTP 窗口定义 `floor(now/period)` 一致的 floor。
          #               `Math.floor` / `Date.now` 都是内建名, 不参与 terser 的标识符混淆;
          #               数字常量被压成 `1e3`。
          #               📌 区分度(实测, 两版线上产物逐字对过):
          #                  v2026.8.5(S 段): Math.round(...)=**2** / Math.floor(...)=**0**
          #                  v2026.8.6(T 段): Math.round(...)=**0** / Math.floor(...)=**1**
          #                  v2026.8.7(U 段): 与 T 段**同值**(round=0 / floor=1)。U 段压根不碰
          #                  TOTP 那两个文件(totp-badge / totp.service) ⇒ 字面量不会变。
          #                  ⚠️ 这一行的数字**没有本机核对**: 本机 `apps/web/build/` 里那份是
          #                     **未压缩**的 webpack 产物(数字不会压成 `1e3`), 数出来必然 0/0,
          #                     照抄会写出假数据。真值以 CI 产物为准 —— 正/负两条断言本身已经够用。
          #                  多出来的那次 round 是 S 段自己在 totp-badge 里算的 `step`(T 段随
          #                  判据一起删了, 见上面第 22 项)。所以正负两条必须同时断: 只断 floor
          #                  的话, 有人把 `step` 的 round 写法加回来也查不出来。
          #
          #     .vw.css   'T 段. 移动端第四轮反馈(第十六批)' —— 段横幅(vaultwarden.css 原样发布, 注释不剥)。
          #     .vw.css   '.warden-domain-row'              —— T2 两条规则的选择器。
          #     .vw.css   'align-items: flex-end !important' —— T2 的**具体修法**。
          #               ★ 不断言那个行 div 的类名: 要修的是"对齐基准", 只断类名的话有人把它
          #                 写回 `center` 也算通过。这个字面量在本文件里唯一(实测 1 次)。
          #     ⚠️ **不要**拿 '.warden-select-open'(R 段, T 段已退役) / 'warden-totp-next'
          #        (S 段) / '.warden-head-newbar'(O 段) 来代表本批 —— 它们在上一版产物里就已存在。
          #     🔴 所有字面量一律带 `--`(本批含 '(' / '.' / 'Math.floor(...)' 里的括号, 不带会被
          #        grep 当选项或语法错 —— fail-fast 的教训)。
          for lit in 'warden-domain-row' 'Math.floor(Date.now()/1e3)'; do
            grep -qF -- "${lit}" .main.js \
              || { echo "❌ 产物 main.js 里找不到第十六批的标记 '${lit}'" >&2; fail=1; }
          done
          #    ★ 负向守卫 1: T3 的旧判据不得复活 —— `Math.round(Date.now()/1e3)` 必须归零
          #      (它既是 totp.service 的老写法, 也是 totp-badge 里那个 `step` 的写法)。
          #      留着它 = 升格动画会在真正换码前 0.5s 开跑, 又回到"旧码先上移、再闪一下"。
          if grep -qF -- 'Math.round(Date.now()/1e3)' .main.js; then
            echo "❌ 产物里又出现了 'Math.round(Date.now()/1e3)': TOTP 升格动画会在换码前 0.5s 开跑(旧码先上移再闪一下)" >&2
            fail=1
          fi
          T_CSS_LITS=('T 段. 移动端第四轮反馈(第十六批)' '.warden-domain-row' \
                      'align-items: flex-end !important')
          for lit in "${T_CSS_LITS[@]}"; do
            grep -qF -- "${lit}" .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到第十六批的标记 '${lit}'" >&2; fail=1; }
          done
          #    ★ 负向守卫 2: T2 的两条规则**必须**写在 @media (max-width:768px) 里(命中行有缩进);
          #      顶格 = 桌面端那一行也被改成 flex-end(桌面端按钮与输入框本来就已对齐, 改了反而错位)。
          #      判据沿用第十四/十五批: `grep -nF` 命中行若在 `行号:` 之后**紧跟非空白字符**即顶格。
          #      只有段横幅不参与(它本来就顶格)。
          for lit in "${T_CSS_LITS[@]}"; do
            case "${lit}" in
              'T 段. 移动端第四轮反馈(第十六批)') continue ;;
            esac
            if grep -nF -- "${lit}" .vw.css | grep -qE '^[0-9]+:[^[:space:]]'; then
              echo "❌ 第十六批的规则 '${lit}' 存在顶格(全局)写法: 桌面端也会被改掉" >&2
              fail=1
            fi
          done

