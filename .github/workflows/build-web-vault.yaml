              echo "❌ 第十五批的规则 '${lit}' 存在顶格(全局)写法: 桌面端也会被藏掉/被压掉" >&2
              fail=1
            fi
          done

          # 24) 第十六批 / T 段: 移动端第四轮反馈(用户反馈 3 条, 全部落地)
          #     ← libs/components/src/select/select.component.{html,ts}   (问题2: 下拉点不开)
          #       + apps/web/src/app/settings/domain-rules.component.html  (问题3: 行加页级钩子)
