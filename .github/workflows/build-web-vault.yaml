          #     ← libs/components/src/select/select.component.html  (问题1/3: 点箭头即展开)
          #       + libs/components/src/select/select.component.ts    (同上: 走 toggle())
          #       + css/vaultwarden.css  (R 段: R0 触摸热点 + R1..R6 窄屏留白/隐藏)
          #     与第十一批/第十三批同理: **不是 L4 迁入的**, 是上线后按用户反馈新增的, 段标记「R 段」。
          #
          #     .main.js  'warden-select-open' —— 🔴 **第十六批/T 段已退役, 这里改成负向断言**。
          #               (历史) 覆盖在原生箭头上的透明触摸热点按钮(模板静态 class)。
          #               ★ 之所以当年自己加按钮: ng-select 原生箭头是 25×20px 的 <span>, 依赖真机把
          #                 touchstart/touchend **合成** click, 那一串被吞就表现为"点箭头没反应"。
          #               ⚠️ 静态 grep 只能证明"热点还在", **证明不了行为**: 本批曾把
          #                 `if (ngSelect.isOpen)` 当布尔用 —— 而那在 v21 是 ModelSignal(函数),
          #                 恒为真 ⇒ 永远只 close()、面板永远打不开, 但模板里的 class 照样在产物里。
          #               🔴 T 段撤掉它的理由(用户第十六批反馈"点了只在方框下面闪一下浅灰色一层就没了"):
          #                 它是 `<ng-select>` 的**兄弟节点**, 而 ng-select 判"外部点击"只比
          #                 `this._select.contains($event.target)` 且自己模板里绑着
          #                 `(outsideClick)="close()"` ⇒ 按它必然被判成"点了外面":
          #                 "pointerdown 里 toggle 开一次 + outsideClick 关一次" = 面板闪一下就没。
          #                 替代方案是把 handler 挂到包装 div 上(T 段, 见下面第 24 项)。
          if grep -qF -- 'warden-select-open' .main.js; then
            echo "❌ 产物 main.js 里又出现了已退役的 'warden-select-open': 那个兄弟节点按钮会让面板开一次立刻被 outsideClick 关掉" >&2
            fail=1
          fi
          #     .vw.css   'R. 第十四批'  —— 段横幅
          #     .vw.css   R1/R2/R4/R3/R5/R6 的六条选择器
          #     ⚠️ '.warden-select-open' **已从本数组移除**(T 段退役): 它的规则块被删掉了,
          #        文件里只剩注释提到这个名字 ⇒ 留在这里会得到一个"注释也命中"的假通过。
          #     🔴 所有字面量都带 `--`: 选择器里有 `-`/`.` 开头的, 不带会被 grep 当选项(fail-fast 的教训)。
          R_CSS_LITS=('R. 第十四批' \
                      'main#main-content .tw-mb-2.tw-pb-2\.5' \
                      'main#main-content .tw-grid.tw-gap-16' \
                      'main#main-content bit-search form:focus-within' \
                      'main#main-content bit-form-field div:has(> textarea)' \
                      'main#main-content app-header header product-switcher' \
                      'main#main-content app-header tools-new-send-dropdown')
          for lit in "${R_CSS_LITS[@]}"; do
