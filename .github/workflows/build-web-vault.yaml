name: Build Web Vault (patched)

# 从源码构建"我们自己的"前端产物。与部署解耦 —— 只在改了前端源码时才需要重跑一次。
# 设计/迁移方案: docs/webvault-source-migration.md
#
# 前端源码来源: shiranzby/vw_web_builds 的 shypwd 分支
#   = vaultwarden/vw_web_builds 的某个版本分支 + 我们的定制提交
# 也就是说定制(移动端视口 / 最小主密码长度 / vaultwarden.css)已经在源码里,
# 构建后**不再**需要任何 sed/python 事后注入, 也不再需要打补丁。
# 构建配方对齐 dani-garcia/bw_web_builds 的 Dockerfile(node:24 + npm ci + dist:oss:selfhost)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物标签 / artifact 名 (如 v2026.8.0)。会与源码里的版本核对, 不一致直接失败"
        required: true
        default: "v2026.8.0"

env:
  # 我们的前端源码 fork。定制已直接落在源码里(见 fork 的 shypwd 分支)。
  VAULT_REPO: "https://github.com/shiranzby/vw_web_builds.git"
  VAULT_BRANCH: "shypwd"
  VAULT_FOLDER: "bw_clients"

jobs:
  build:
    name: Build web vault from source
    runs-on: ubuntu-latest
    # 首次约 20-35 分钟(装整个 monorepo + Angular 生产构建), 给足余量
    timeout-minutes: 90

    steps:
      # 目前这一步只为"将来可能需要仓库内的构建脚本/校验文件"而保留;
      # 定制搬进 fork 源码后, 构建本身已不再依赖本仓库的任何文件。
      - name: Checkout our repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Disk space before
        run: df -h / /home/runner

      - name: Compute version variables
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          echo "VERSION_NO_V=${V#v}" >> "$GITHUB_ENV"   # v2026.8.0 -> 2026.8.0 (vw-version.json 用)
          echo "版本变量: VERSION_NO_V=${V#v}"

      - name: Clone our frontend fork
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${VAULT_BRANCH}" "${VAULT_REPO}" "${VAULT_FOLDER}"
          echo "repo   : ${VAULT_REPO}"
          echo "branch : ${VAULT_BRANCH}"
          echo "commit : $(git -C "${VAULT_FOLDER}" rev-parse HEAD)"

      # 版本一致性校验。inputs.version 决定 artifact 名, 而部署侧是按 artifact 名反查构建的,
      # 一旦标错版本, 部署侧就找不到产物(或更糟: 静默用了错版本的产物)。这里用源码里的
      # apps/web/package.json 兜底 —— 它才是产物真实的 Bitwarden 版本。
      - name: Verify version matches the source
        run: |
          set -euo pipefail
          SRC_VER="$(node -p "require('./${VAULT_FOLDER}/apps/web/package.json').version")"
          echo "源码版本 = ${SRC_VER}"
          echo "输入版本 = ${VERSION_NO_V}"
          if [ "${SRC_VER}" != "${VERSION_NO_V}" ]; then
            echo "❌ 版本不一致: 源码是 ${SRC_VER}, 但 inputs.version 是 v${VERSION_NO_V}。" >&2
            echo "   要么把 inputs.version 改成 v${SRC_VER}, 要么先把 fork 的 ${VAULT_BRANCH} 分支 rebase 到目标版本。" >&2
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}"
          npm ci --no-audit --no-fund

      - name: Build web vault (oss, selfhost)
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}/apps/web"
          npm run dist:oss:selfhost

          # vw-version.json —— 官方 bw_web_builds 的 build_web_vault.sh 也会生成它。
          # 注意它记的不是 Bitwarden 版本, 而是"构建仓库自己的 tag": 官方 v2026.6.4 的产物里
          # 内容是 {"version":"2026.6.4"}。上游用 `git ls-remote` 取"远端最新 tag", 我们版本是钉死的,
          # 所以等价于"我们钉的 tag 去掉前导 v"。必须生成 —— 否则产物比官方少一个文件。
          printf '{"version":"%s"}' "${VERSION_NO_V}" > build/vw-version.json
          echo "vw-version.json: $(cat build/vw-version.json)"

          echo "── 产物 ──"
          ls -la build > .build-listing.txt || true
          head -20 .build-listing.txt

      - name: "Package (structure must match bw_web_builds: web-vault/ at top level)"
        run: |
          set -euo pipefail
          cd "${VAULT_FOLDER}/apps/web"
          mv build web-vault
          tar -czvf "${GITHUB_WORKSPACE}/bw_web_vault.tar.gz" web-vault --owner=0 --group=0

          cd "${GITHUB_WORKSPACE}"
          echo "=== sha256 ==="
          sha256sum bw_web_vault.tar.gz
          echo "=== 大小 ==="
          du -h bw_web_vault.tar.gz

          # ⚠️ 先把清单落盘再截取。直接写 `tar -tzf ... | head -N` 会在 set -o pipefail 下失败:
          # head 读够 N 行就退出 → tar 继续写管道拿到 EPIPE → "tar: stdout: write error" → exit 2
          # → 整步失败。任何"消费者可能提前退出"的管道都不要和 pipefail 一起用。
          tar -tzf bw_web_vault.tar.gz > .vault-contents.txt
          echo "=== 顶层结构(应与官方一致: web-vault/) ==="
          head -12 .vault-contents.txt
          echo "=== 文件数 ==="
          wc -l < .vault-contents.txt
          echo "=== 自带 source map 数(本地读源码靠它) ==="
          grep -c '\.map$' .vault-contents.txt || true
          echo "=== vw-version.json(应为 {\"version\":\"${VERSION_NO_V}\"}) ==="
          tar -xzOf bw_web_vault.tar.gz web-vault/vw-version.json || echo "❌ 缺少 vw-version.json"
          # 同样落盘再打印, 避免 pipefail + SIGPIPE
          tar -xzOf bw_web_vault.tar.gz web-vault/css/vaultwarden.css > .vw.css 2>/dev/null \
            && { echo "=== css/vaultwarden.css(应由构建自带, 过去靠部署时 cp 补) ==="; head -8 .vw.css; } \
            || echo "❌ 缺少 css/vaultwarden.css"

      # 断言"定制真的进了产物"。以前这里断言的是"补丁打上去了"; 现在定制在源码里,
      # 所以改为断言源码级定制在**产物**中可见 —— 防止 rebase 上游时把改动弄丢。
      - name: Verify our customizations are in the built artifact
        run: |
          set -euo pipefail

          tar -xzOf bw_web_vault.tar.gz web-vault/index.html > .index.html
          VIEWPORT="$(grep -o '<meta name="viewport"[^>]*>' .index.html || true)"
          echo "viewport: ${VIEWPORT}"

          # 用落盘的清单再 grep —— 不能写 `tar -tzf ... | grep -m1`, 见上一步注释(pipefail + SIGPIPE)
          MAIN_JS="$(grep -m1 'app/main\..*\.js$' .vault-contents.txt || true)"
          if [ -z "${MAIN_JS}" ]; then echo "❌ 清单里找不到 app/main.*.js" >&2; exit 1; fi
          tar -xzOf bw_web_vault.tar.gz "${MAIN_JS}" > .main.js
          echo "主密码最小长度常量:"
          grep -o 'minimumPasswordLength=[0-9]*' .main.js | sort -u || true
          echo "同名的原始常量(必须仍是 8, 官方用它判断策略是否变更过):"
          grep -o 'originalMinimumPasswordLength=[0-9]*' .main.js | sort -u || true

          fail=0

          # 1) 移动端视口  ← apps/web/src/index.html
          case "${VIEWPORT}" in
            *width=1010*)
              echo "❌ viewport 仍是 width=1010 —— 源码里的定制丢了" >&2; fail=1 ;;
            *width=device-width*)
              echo "✅ viewport 自适应 (device-width)" ;;
            *)
              echo "❌ viewport 既不是 1010 也不是 device-width, 意外值: ${VIEWPORT}" >&2; fail=1 ;;
          esac

          # 2) 最小主密码长度  ← libs/common/src/platform/misc/utils.ts
          #    注意源码里另有一个 originalMinimumPasswordLength(大写 M)=8, 这里查的是小写 m 的
          #    minimumPasswordLength, 不会被它误判成"已改过"。
          if grep -q 'minimumPasswordLength=12' .main.js; then
            echo "❌ 主密码最小长度仍是 12 —— 源码里的定制丢了" >&2; fail=1
          fi
          grep -q 'minimumPasswordLength=8' .main.js \
            || { echo "❌ 产物里没有 minimumPasswordLength=8" >&2; fail=1; }

          # 3) vaultwarden.css  ← apps/web/src/css/ + copy-webpack-plugin 的 patterns
          #    上游只在 index.html 里加了 <link href="css/vaultwarden.css">, 但 copy-webpack-plugin
          #    默认不复制 src/css, 所以官方产物从来没有这个文件。我们的 fork 显式声明了复制规则。
          if tar -xzOf bw_web_vault.tar.gz web-vault/css/vaultwarden.css > .vw.css 2>/dev/null; then
            grep -q '\.vw-hide' .vw.css \
              || { echo "❌ css/vaultwarden.css 内容不对(找不到 .vw-hide)" >&2; fail=1; }
            echo "✅ css/vaultwarden.css 由构建自带 ($(wc -c < .vw.css) bytes)"
          else
            echo "❌ 产物缺少 css/vaultwarden.css —— copy-webpack-plugin 的复制规则没生效" >&2; fail=1
          fi

          [ "${fail}" -eq 0 ] || exit 1
          echo "✅ 三项源码级定制均已在实际产物中得到验证"

      - name: Disk space after
        if: always()
        run: df -h / /home/runner

      # 产物只以 Actions artifact 形式保存(不建 Release)。
      # 为什么不发 Release: 本仓库(一个 fork)的 Releases API 在 GitHub 侧是坏的 ——
      # POST /releases 与 PATCH /repos 一律返回 **HTTP 500 且 body 为空**,
      # 用 workflow 的 GITHUB_TOKEN 和全权限 PAT 都一样(DELETE tag 却正常返回 204)。
      # 实测 POST /releases 虽然报 500, 却会真的建出 release 记录 → 留下重复的脏数据。
      # 所以改走 artifact: 部署工作流用 `gh run download` 取(同仓库, 默认 token 就能读)。
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bw_web_vault-${{ inputs.version }}
          path: bw_web_vault.tar.gz
          # 部署侧要靠它, 别按默认 14 天过期; 过期了部署会直接失败(不会静默降级)
          retention-days: 90
