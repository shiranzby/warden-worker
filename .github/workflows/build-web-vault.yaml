          #       🔴🔴 注意 `:has(> textarea[bitInput])` 里的 `[bitInput]` **不是可选的修饰**:
          #          对方是 `has-[textarea]:!tw-py-3`(一个类 + !important), 两条都带 !important 时
          #          **比权重、与书写先后无关**; 少了这个属性选择器本条只有 (0,0,5) 会被压掉
          #          ⇒ 写成 `div:has(> textarea)` 就是一颗"看着生效其实没生效"的哑弹。
          #          所以判据必须断**带属性**的完整写法(已用 CSSOM insertRule 实测: 不带=62px 无效)。
          W_CSS_LITS=('W 段. 移动端第七轮反馈(第十九批)' \
                      'bit-dialog:has(tools-send-form) bit-form-field div:has(> textarea[bitInput])' \
                      '--warden-filters-new-fs: 14px')
          for lit in "${W_CSS_LITS[@]}"; do
            grep -qF -- "${lit}" .vw.css \
              || { echo "❌ css/vaultwarden.css 里找不到第十九批的标记 '${lit}'" >&2; fail=1; }
          done
          #    ★ 负向守卫: 两条都**只在窄屏生效** —— 顶格 = 桌面端跟着遭殃:
          #      W1 会把桌面端发送表单里 textarea 的外层内边距清零(桌面端刻意保留多行高度);
          #      W2 会把桌面端那颗本已隐藏的新增按钮撑满并放大字号。
          #      判据沿用第十四~十八批; 段横幅单独排除(它本来就顶格)。
          for lit in "${W_CSS_LITS[@]}"; do
            case "${lit}" in
              'W 段. 移动端第七轮反馈(第十九批)') continue ;;
            esac
            if grep -nF -- "${lit}" .vw.css | grep -qE '^[0-9]+:[^[:space:]]'; then
              echo "❌ 第十九批的规则 '${lit}' 存在顶格(全局)写法: 桌面端也会被改掉" >&2
              fail=1
            fi
          done

          [ "${fail}" -eq 0 ] || exit 1
          echo "✅ 二十七项源码级定制(F/G/J8/J9/J12/J14/J17 + 视口 + 主密码长度 + J7/A段 + 第六批 4b/I/J10/J11 + 第七批 J6/B段 + 第八批 J16/E段 + 第九批 J15 + 第十批/N段 + 第十一批/O段 + 第十二批/P段 + 第十三批/Q段 + 第十四批/R段 + 第十五批/S段 + 第十六批/T段 + 第十七批/U段 + 第十八批/V段 + 第十九批/W段)均已在实际产物中得到验证"

      - name: Disk space after
        if: always()
        run: df -h / /home/runner

      # 产物只以 Actions artifact 形式保存(不建 Release)。
      # 为什么不发 Release: 本仓库(一个 fork)的 Releases API 在 GitHub 侧是坏的 ——
      # POST /releases 与 PATCH /repos 一律返回 **HTTP 500 且 body 为空**,
      # 用 workflow 的 GITHUB_TOKEN 和全权限 PAT 都一样(DELETE tag 却正常返回 204)。
      # 实测 POST /releases 虽然报 500, 却会真的建出 release 记录 → 留下重复的脏数据。
      # 所以改走 artifact: 部署工作流用 `gh run download` 取(同仓库, 默认 token 就能读)。
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bw_web_vault-${{ inputs.version }}
          path: bw_web_vault.tar.gz
          # 部署侧要靠它, 别按默认 14 天过期; 过期了部署会直接失败(不会静默降级)
          retention-days: 90
