          #      只有 'R. 第十四批'(段横幅, 本来就顶格) 不参与守卫。
          #      📌 原来这里还 skip 掉 '.warden-select-open'(当年它是"设计成全局"的 R0) ——
          #         T 段把它整条删掉之后, 那一项已从数组里移除, skip 也一并删掉。
          #
          #    🔴 判据写法踩过的坑(务必照抄现写法, 不要改回手写正则):
          #      第一版把守卫写成 `grep -qE '^main#main-content app-header product-switcher'` ——
          #      **漏抄了真实的 `header` 一词**, 于是永远不匹配。离线证伪(把该规则从 @media 内
          #      提成顶格)时它**照样通过** —— 一个纯粹的哑弹: 谁把规则误写成全局都拦不住。
          #      现在改为: ①守卫遍历的字面量**直接复用上面那个数组**(单一口径, 结构上不可能漂移);
          #      ②判据用 `grep -nF` 的输出 —— 命中行若在 `行号:` 之后**紧跟非空白字符**, 即该处
          #      顶格(全局); 所有命中都带缩进才算合规。既不依赖缩进几格, 也不写正则。
          #      ⚠️ 每批加守卫时都要**离线证伪一次**(故意改成顶格, 确认它真的报错)再提交。
          for lit in "${R_CSS_LITS[@]}"; do
            case "${lit}" in
              'R. 第十四批') continue ;;
            esac
            if grep -nF -- "${lit}" .vw.css | grep -qE '^[0-9]+:[^[:space:]]'; then
              echo "❌ 第十四批的规则 '${lit}' 存在顶格(全局)写法: 桌面端也会被藏掉/被压掉" >&2
              fail=1
            fi
          done

          # 23) 第十五批 / S 段: 移动端第三轮反馈(用户反馈 4 组, 全部落地)
          #     ← libs/components/src/select/select.component.html|ts   (问题1: 窄屏下拉改"纯选择器")
          #       + apps/web/src/app/vault/components/vault-items/totp-badge.component.html|ts
          #         + libs/common/src/vault/services/totp.service.ts    (问题10b: 次码 + 升格动画)
          #       + apps/web/src/app/tools/send/send.component.html
          #         + apps/web/src/app/dirt/reports/pages/reports-home.component.html  (两处页头钩子)
          #       + apps/web/src/css/vaultwarden.css (S0/S1-a/S1-b/S2 + 次码/升格那一组)
          #     与前几批同理: **不是 L4 迁入的**, 是上线后按用户反馈新增的, 段标记「S 段」。
          #
          #     .main.js  '(max-width: 768px)'  —— 窄屏判定用的 MediaQuery 查询串。
          #               ★ 本批**唯一只存在于 TS 里**的修复: 窄屏把 `searchable` 关掉, 于是
          #                 ng-select 原生 handleMousedown() 走 toggle() —— 点**整块表单**既能
          #                 展开也能收起, 且输入框 readOnly(全程不弹软键盘)。这正是用户
          #                 "只点击箭头展开后无法再点击箭头关闭"那条的根治点。
          #                 它同时是"问题1 是否真改过"的**唯一静态判据**: 改回 searchable 恒定
          #                 这一串就没了。只取查询串、不含标识符(`narrow`/`narrowQuery` 会被
          #                 terser 混淆), 所以 rebase 上游后仍稳。
          #                 📌 有区分度(实测): v2026.8.4(上一版线上产物)里出现 **0** 次。
          #               ⚠️ 别拿它去断"窄屏才生效" —— 它只是那句话的字符串, 跟 @media 无关。
          #     .main.js  'warden-totp-next' / 'warden-totp-ghost' —— 盒内三行里常驻 DOM 的两行
          #               (次码 / 旧主码), 模板上的静态 class; 'warden-totp-rolling' 是
          #               `[class.x]` 绑定, Angular 编译后照样留下这个字面量。
          #               ★ 三行**常驻**而不是 @if 开关: 新建元素在同一帧就被加样式, 浏览器
          #                 不会为它跑 transition ⇒ 进场动画退化成"直接出现"。这一条只在
          #                 真机上看得出来(grep 只能证明类名在产物里)。
          #     .main.js  'warden-bare-header' —— 发送页/报告页模板上的**页级钩子**(静态 class)。
          #               页头是共享组件(app-header → web-header → bit-header), 想只影响这两页
          #               就必须有页级钩子, 否则选择器只能写全局。
          #     🔴 所有字面量一律带 `--`: '(max-width: 768px)' 以 `(` 开头, 不带会被 grep
          #        当成选项语法错(fail-fast 的教训, 第十四批已栽过一次)。
          #
          #     .vw.css   'S 段. 移动端适配(第十五批)' —— 段横幅(vaultwarden.css 原样发布, 注释不剥)。
          #     .vw.css   S0/S1-a/S1-b/S2 的四条选择器 + 次码/升格那一组。
          #     ⚠️ **不要**拿 '.warden-select-open'(R 段) / '.warden-auth-title'(更早) /
          #        'warden-tabbar'(更早) 来代表本批 —— 它们在上一版产物里就已存在, 等于"没修也能过"。
          for lit in '(max-width: 768px)' 'warden-totp-next' 'warden-totp-ghost' \
                     'warden-totp-rolling' 'warden-bare-header'; do
            grep -qF -- "${lit}" .main.js \
              || { echo "❌ 产物 main.js 里找不到第十五批的标记 '${lit}'" >&2; fail=1; }
          done
          #    ★ 负向守卫(两种口径, 与第十四批同一套判据):
