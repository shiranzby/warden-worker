name: Build
permissions:
    contents: read
    # 下载我们自己的前端产物(build-web-vault.yaml 的 Actions artifact)要用。
    # ⚠️ 一旦声明了 permissions, 没列出的作用域会被置为 none —— 漏了这行 gh run download 会 403。
    actions: read

on:
  push:
    branches: [main, uat, release*]
  workflow_dispatch:

jobs:
  build:
    name: Run production build
    runs-on: ubuntu-latest
    env:
      # Pin tool versions to avoid upstream updates breaking CI
      WORKER_BUILD_VERSION: "0.8.5"
      WRANGLER_VERSION: "4.82.1"
      # Web Vault frontend (bw_web_builds) version tag (default pinned; override via GitHub Actions Variables)
      # - Set repository variable BW_WEB_VERSION (e.g. v2026.6.4) to override
      # - Set to "latest" to follow the latest bw_web_builds release
      BW_WEB_VERSION: ${{ vars.BW_WEB_VERSION || 'v2026.6.4' }}

      # Required for wrangler (Global API Key auth: EMAIL + API_KEY pair)
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js (for npx wrangler)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$TOOLCHAIN" ]; then
            echo "❌ Failed to read toolchain channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "Using Rust toolchain: $TOOLCHAIN"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # - name: Cache Cargo registry and build artifacts
      #   uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      #   with:
      #       path: |
      #           target
      #           ~/.cargo/bin
      #           ~/.cargo/registry
      #           ~/.cargo/git
      #       key: cargo-build-cache-${{ github.run_id }}
      #       restore-keys: |
      #           cargo-build-cache-
      - name: Install lld
        run: sudo apt install -y lld clang gcc llvm

      - name: Install worker-build
        run: |
          set -euo pipefail
          if command -v worker-build &> /dev/null; then
            echo "worker-build already installed: $(worker-build --version || true)"
          fi
          cargo install --locked -q worker-build --version "${WORKER_BUILD_VERSION}"

      - name: Download and extract frontend (our patched build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${BW_WEB_VERSION}"
          if [ "${TAG}" = "latest" ]; then
            TAG="$(curl -s https://api.github.com/repos/dani-garcia/bw_web_builds/releases/latest | jq -r .tag_name)"
          fi

          echo "📦 前端版本: ${TAG}"

          # 取"我们自己的"构建产物 —— 由 .github/workflows/build-web-vault.yaml 构建。
          # 原先这里是从 dani-garcia/bw_web_builds 下官方包, 再用 sed/python 在压缩产物上打补丁;
          # 现在改动(最小主密码长度 8、移动端视口)已经在源码里打好(webvault/patches),
          # 所以那两步(case (a) 的运行期补丁)已删除。见 docs/webvault-source-migration.md。
          #
          # 注: 不发 Release 而是走 artifact —— 本仓库(一个 fork)的 Releases API 在 GitHub 侧
          # 一直返回 HTTP 500(POST /releases、PATCH /repos 都是, 换全权限 PAT 也一样)。
          # 用 artifact 名反查 run, 而不是 gh run list --status=success --limit=1。
          # 原因: run list 在 GitHub 索引滞后时会返回**上一个**成功的构建 —— 实测曾返回未打补丁的
          # 基线 run 34747235498(commit ed8f883), 会静默把没打补丁的前端发上线。
          # artifact 名 == "bw_web_vault-${TAG}" 是确定性的: 取其中最新且未过期的一个, 再取其 workflow_run.id。
          ART_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=bw_web_vault-${TAG}&per_page=100")"
          RUN_ID="$(printf '%s' "${ART_JSON}" \
            | jq -r '(.artifacts // []) | map(select(.expired == false)) | sort_by(.created_at) | reverse | (.[0].workflow_run.id // empty)')"
          if [ -z "${RUN_ID}" ]; then
            echo "❌ 找不到未过期的 artifact 'bw_web_vault-${TAG}'。" >&2
            echo "   先跑: Actions → 'Build Web Vault (patched)' → Run workflow (version=${TAG})" >&2
            exit 1
          fi
          echo "使用构建 run: ${RUN_ID} (由 artifact 名 bw_web_vault-${TAG} 反查)"

          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "bw_web_vault-${TAG}" --dir .frontend

          # Extract to public/web-vault
          tar -xzf ".frontend/bw_web_vault.tar.gz" -C public/

          # bw_web_builds extracts into a web-vault folder (expected)
          if [ ! -d "public/web-vault" ]; then
            echo "❌ Expected ./public/web-vault after extracting" >&2
            ls -la public/ | head -50 || true
            exit 1
          fi

          # Remove large source maps to satisfy Cloudflare static asset per-file limits
          find public/web-vault -type f -name '*.map' -delete

          echo "✅ Frontend files extracted to ./public/web-vault"
          ls -la public/web-vault/ | head -20

      # 硬校验: 确保 public/web-vault 真的是"打了补丁的我们自己构建的产物"。
      # 这是选构建脆弱性(gh run list 索引滞后)之外的第二道保险 —— 一旦拿到官方包或旧基线包,
      # 这里会立刻失败, 而不是把没打补丁的前端静默发上线。
      - name: Verify frontend is our patched build (fail hard)
        run: |
          set -euo pipefail
          IDX="public/web-vault/index.html"
          [ -f "${IDX}" ] || { echo "❌ 缺少 ${IDX}" >&2; exit 1; }

          # 1) 移动端视口补丁 (webvault/patches/02-viewport-mobile.patch)
          if grep -q 'width=1010' "${IDX}"; then
            echo "❌ index.html 仍是 width=1010 —— 视口补丁未生效, 拿到的不是打了补丁的产物。" >&2
            exit 1
          fi
          grep -q 'width=device-width' "${IDX}" || {
            echo "❌ index.html 找不到 width=device-width。" >&2; exit 1; }

          # 2) 主密码最小长度补丁 (webvault/patches/01-minimum-password-length.patch)
          #    注意: 源码里另有一个 originalMinimumPasswordLength=8(大写 M), 这里查的是小写 m 的
          #    minimumPasswordLength, 不会被它误判为"已打补丁"。
          MAIN="$(find public/web-vault/app -maxdepth 1 -name 'main.*.js' | head -n1)"
          [ -n "${MAIN}" ] || { echo "❌ 找不到 public/web-vault/app/main.*.js" >&2; exit 1; }
          if grep -q 'minimumPasswordLength=12' "${MAIN}"; then
            echo "❌ ${MAIN} 里仍是 minimumPasswordLength=12 —— 主密码补丁未生效。" >&2
            exit 1
          fi
          grep -q 'minimumPasswordLength=8' "${MAIN}" || {
            echo "❌ ${MAIN} 找不到 minimumPasswordLength=8。" >&2; exit 1; }

          # 3) 构建版本标记: 只有我们自己的 build-web-vault.yaml 会生成它, 官方包没有
          [ -f public/web-vault/vw-version.json ] || {
            echo "❌ 缺少 web-vault/vw-version.json —— 这不是我们自己的构建产物。" >&2; exit 1; }

          echo "✅ 前端补丁校验通过: viewport=device-width, minimumPasswordLength=8, vw-version.json=$(cat public/web-vault/vw-version.json)"

      - name: Apply web vault overrides (vaultwarden.css)
        run: |
          mkdir -p public/web-vault/css/ && cp public/css/vaultwarden.css public/web-vault/css/

      # 原先这里有一个 "Patch web vault master password minimum length" 步骤(sed 在压缩产物上
      # 把 minimumPasswordLength=12 改成 8)。Phase 1 已把它搬进源码:
      #   webvault/patches/01-minimum-password-length.patch
      # 视口替换同理: webvault/patches/02-viewport-mobile.patch(见下面的注入步骤)。
      - name: Inject shypwd custom frontend (TOTP inline + mobile adaptation)
        run: |
          set -euo pipefail
          # 1) 复制自定义 CSS/JS 到 web-vault 根目录(源文件来自仓库 custom/)
          cp custom/custom.css public/web-vault/custom.css
          cp custom/custom.js   public/web-vault/custom.js

          # 2) 修补 index.html: 注入自定义 CSS/JS 引用
          #    注意: 视口(width=1010 -> device-width)已不在这一步做, 已搬到源码
          #    webvault/patches/02-viewport-mobile.patch
          python3 - <<'PY'
          p = "public/web-vault/index.html"
          s = open(p, encoding="utf-8").read()

          # 注入自定义 CSS(放在 </head> 前)
          css_tag = '<link rel="stylesheet" href="custom.css"/>'
          if css_tag not in s and "</head>" in s:
              s = s.replace("</head>", css_tag + "</head>", 1)
              print("custom.css link injected")
          else:
              print("WARNING: custom.css link already present or </head> missing")

          # 注入自定义 JS(放在 </body> 前; 脚本内部用 MutationObserver 自适应加载时机)
          js_tag = '<script src="custom.js"></script>'
          if js_tag not in s and "</body>" in s:
              s = s.replace("</body>", js_tag + "</body>", 1)
              print("custom.js script injected")
          else:
              print("WARNING: custom.js script already present or </body> missing")

          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Replace D1_DATABASE_ID in wrangler.toml
        run: sed -i "s/\${D1_DATABASE_ID}/${{ secrets.D1_DATABASE_ID }}/g" wrangler.toml

      - name: Enable R2 binding when R2_NAME is provided
        env:
          R2_NAME: ${{ secrets.R2_NAME }}
        run: |
          if [ -n "$R2_NAME" ]; then
            echo "🔧 Enabling R2 bucket binding"
            {
              echo ''
              echo '[[r2_buckets]]'
              echo 'binding = "ATTACHMENTS_BUCKET"'
              echo "bucket_name = \"${R2_NAME}\""
            } >> wrangler.toml
          else
            echo "⏭️ R2_NAME not set, skipping R2 binding"
          fi

      - name: Bootstrap D1 schema when database is empty
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@${WRANGLER_VERSION}"

          # Capture raw wrangler output so jq parse errors don't hide the real failure.
          set +e
          D1_OUT="$($WRANGLER d1 execute vault1 --remote --command \
            "SELECT COUNT(*) AS cnt FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT IN ('d1_migrations');" \
            --json 2>&1)"
          D1_STATUS=$?
          set -e
          if [ $D1_STATUS -ne 0 ]; then
            echo "❌ wrangler d1 execute failed (exit=$D1_STATUS). Raw output:"
            echo "$D1_OUT"
            exit $D1_STATUS
          fi

          TABLE_COUNT="$(printf '%s' "$D1_OUT" | jq -er 'if type=="array" and (length>0) and (.[0].results|type=="array") and (.[0].results|length>0) then (.[0].results[0].cnt // 0) else error("unexpected JSON shape") end' 2>/dev/null || true)"
          if [ -z "${TABLE_COUNT}" ]; then
            echo "❌ Unexpected JSON from wrangler (cannot extract table count). Raw output:"
            echo "$D1_OUT"
            exit 1
          fi

          echo "Existing app table count: ${TABLE_COUNT}"
          if [ "${TABLE_COUNT}" = "0" ]; then
            echo "🆕 Empty D1 database detected; applying sql/schema.sql..."
            $WRANGLER d1 execute vault1 --remote --file sql/schema.sql

            echo "📝 Marking existing migrations as applied (schema.sql already includes them)"
            BOOTSTRAP_SQL="$(mktemp)"
            cat >"${BOOTSTRAP_SQL}" <<'SQL'
          CREATE TABLE IF NOT EXISTS d1_migrations (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT UNIQUE NOT NULL,
            applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
          );
          SQL
            shopt -s nullglob
            for f in migrations/*.sql; do
              echo "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$(basename "${f}")');" >>"${BOOTSTRAP_SQL}"
            done

            $WRANGLER d1 execute vault1 --remote --file "${BOOTSTRAP_SQL}"
            rm -f "${BOOTSTRAP_SQL}"
          else
            echo "⏭️ D1 already has tables; skipping base schema bootstrap"
          fi

      - name: Apply D1 database migrations
        run: |
          set -euo pipefail  # Ensure pipe returns first non-zero exit code
          WRANGLER="npx --yes wrangler@${WRANGLER_VERSION}"

          # Apply migrations with retry loop to handle legacy ensure_schema columns
          MAX_RETRIES=15
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔄 Attempting to apply migrations (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            if $WRANGLER d1 migrations apply vault1 --remote 2>&1 | tee migration_output.txt; then
              echo "✅ All migrations applied successfully"
              exit 0
            fi
            
            # Check if failure is due to duplicate column (from legacy ensure_schema)
            if grep -q "duplicate column name" migration_output.txt; then
              # Extract the migration name that failed
              # Format: "Migration 0001_add_password_salt.sql failed with the following errors:"
              FAILED_MIGRATION=$(grep -oP "Migration \K[0-9]+_[a-zA-Z0-9_]+\.sql(?= failed)" migration_output.txt)
              if [ -z "$FAILED_MIGRATION" ]; then
                echo "❌ Detected duplicate column error, but could not identify the migration filename from output."
                cat migration_output.txt
                exit 1
              fi
              
              echo "⚠️ Migration '$FAILED_MIGRATION' failed: column already exists"
              echo "📝 Marking migration as applied..."
              
              # Initialize d1_migrations table and mark this migration as applied
              $WRANGLER d1 execute vault1 --remote --command "
                CREATE TABLE IF NOT EXISTS d1_migrations (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT UNIQUE NOT NULL,
                  applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
                );
                INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$FAILED_MIGRATION');
              "
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "🔁 Retrying remaining migrations..."
            else
              echo "❌ Migration failed with unexpected error:"
              cat migration_output.txt
              exit 1
            fi
          done

          echo "❌ Max retries ($MAX_RETRIES) exceeded"
          exit 1

      - name: Seed global equivalent domains (optional)
        env:
          SEED_GLOBAL_DOMAINS: ${{ vars.SEED_GLOBAL_DOMAINS || 'true' }}
          GLOBAL_DOMAINS_URL: ${{ vars.GLOBAL_DOMAINS_URL }}
        run: |
          set -euo pipefail
          if [ "${SEED_GLOBAL_DOMAINS}" = "false" ]; then
            echo "⏭️ SEED_GLOBAL_DOMAINS=false, skipping"
            exit 0
          fi

          if [ -n "${GLOBAL_DOMAINS_URL:-}" ]; then
            bash scripts/seed-global-domains.sh --db vault1 --remote --wrangler-version "${WRANGLER_VERSION}" --url "${GLOBAL_DOMAINS_URL}"
          else
            bash scripts/seed-global-domains.sh --db vault1 --remote --wrangler-version "${WRANGLER_VERSION}"
          fi

      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        id: cf
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          command: deploy

      - name: Set runtime secrets
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          for kv in ALLOWED_EMAILS JWT_SECRET JWT_REFRESH_SECRET; do
            printf '%s' "${!kv}" | npx --yes wrangler@${WRANGLER_VERSION} secret put "$kv"
          done
