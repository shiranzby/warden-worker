# ⚠️ 临时工作流：只做编译检查，**不部署**。
#
# 存在理由：本机没有 Rust 工具链（生产是 Rust→WASM，只能在 CI 编），而
# `push-cloudflare.yaml` 一推 main 就会"先跑迁移、再编译、编译过了才部署"。
# 为了不在 main 上留下失败的构建记录、也让迭代快一点，先用这个分支工作流把编译跑绿。
#
# 用完即删（第二十三批 AB 段收工清单里的一条）。
name: CI (rust compile check only)

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

jobs:
  check:
    name: cargo check --target wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml | head -n 1)"
          echo "Using Rust toolchain: $TOOLCHAIN"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown

      - name: cargo check
        run: |
          set -euo pipefail
          # 不用 --locked 会因 Cargo.lock 与 registry 索引漂移而偶发失败；保持与生产一致的锁定解析
          cargo check --locked --target wasm32-unknown-unknown --release 2>&1 | tee check.log
          echo "---- 警告/错误摘要 ----"
          grep -E '^(error|warning)' check.log | sort | uniq -c | sort -rn | head -20 || true
